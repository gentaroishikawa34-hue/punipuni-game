<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>めがねをはずして、ぷにぷに。</title><style>
:root{--ink:#684d44;--pink:#f27f92;--blue:#679dc2}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:'Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,sans-serif;background:#f2e8df;overflow:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #9d678c;outline-offset:4px}button:disabled{cursor:default}.app{position:relative;isolation:isolate;max-width:520px;height:100svh;height:100dvh;margin:auto;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 22px max(14px,env(safe-area-inset-bottom));overflow:hidden;background:linear-gradient(165deg,#fff9eec9,#f9e5dfb3 65%,#fce4e8)}.room{position:absolute;inset:0;z-index:-2;filter:blur(2px);opacity:.65;background:linear-gradient(0deg,#e8cdb5 0 20%,transparent 20%),linear-gradient(90deg,transparent 65%,#eed9c6 65% 67%,transparent 67%)}.window{position:absolute;left:-35px;top:24%;width:155px;height:235px;border:13px solid #fffbec;border-radius:5px;background:linear-gradient(90deg,transparent 46%,#fffaf0 46% 52%,transparent 52%),linear-gradient(0deg,transparent 47%,#fffaf0 47% 53%,transparent 53%),#d8eced;box-shadow:0 0 60px #fff}.shelf{position:absolute;right:-20px;bottom:23%;width:130px;height:140px;border:10px solid #dabb9e;background:repeating-linear-gradient(90deg,#c6cddd 0 18px,#f7d1bd 18px 34px,#eadcad 34px 50px)}.poster{position:absolute;right:14px;top:28%;transform:rotate(8deg);background:#fff5df;padding:18px;font-size:28px;color:#d6ac9e;box-shadow:1px 3px 9px #b6978630}header{text-align:center;flex:none}h1{font-size:clamp(21px,5.6vw,29px);line-height:1.45;margin:1px 0 13px;letter-spacing:.01em;font-weight:900;text-shadow:0 2px #fff}h1 span{display:block;font-size:1.43em;color:#ed7c8b;letter-spacing:.06em;-webkit-text-stroke:1px #ed7c8b;text-shadow:2px 3px #fff}.eyebrow{font-size:10px;letter-spacing:.2em;color:#ac9183;margin:0 0 4px}.topline{display:flex;gap:9px;align-items:center;justify-content:space-between}.counter{background:#fff7df;border:2px solid white;border-radius:24px;padding:7px 15px;box-shadow:0 3px 0 #dac9b72e;font-weight:800;white-space:nowrap;font-size:14px}.counter b{color:#ed7c8b;font-size:28px;margin:0 5px}.guide{font-weight:800;font-size:15px}.guide small{display:block;text-align:center;font-size:11px;font-weight:500;margin-top:3px}.scene{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}.boy{height:100%;width:100%;max-height:480px;overflow:visible;filter:drop-shadow(0 7px 0 #bd977714)}.speech{position:absolute;top:1%;left:50%;transform:translateX(-50%);background:#fffdf6;border:2px solid #e9d8c8;border-radius:24px;padding:9px 16px;font-size:14px;font-weight:bold;white-space:nowrap;z-index:2;box-shadow:0 4px 0 #c29e8310}.speech:after{content:'';position:absolute;left:48%;bottom:-8px;width:12px;height:12px;background:#fffdf6;border-right:2px solid #e9d8c8;border-bottom:2px solid #e9d8c8;transform:rotate(45deg)}.eye{cursor:pointer;outline:none;transform-box:fill-box;transform-origin:center}.eye:focus-visible .hit{stroke:#f097ad;stroke-width:3;stroke-dasharray:5 4}.hit{fill:transparent;pointer-events:all}.eye-line{fill:none;stroke:#654637;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.puni-eye{display:none}.play .puni-eye,.finished .puni-eye{display:inline}.play .normal-eye,.finished .normal-eye{display:none}.glasses{transition:opacity .32s,transform .45s;transform-origin:200px 200px}.play .glasses,.finished .glasses{opacity:0;transform:translate(55px,70px) rotate(20deg);pointer-events:none}.anger{opacity:0}.finished .anger{opacity:1}.finished .mouth{display:none}.finished #head{animation:refuse .4s 2}.finished .eye{pointer-events:none}.squish{animation:squish .48s cubic-bezier(.22,.6,.38,1.4)}.breathe{transform-origin:200px 390px;animation:breathe 3s ease-in-out infinite}.effect{position:absolute;pointer-events:none;color:#f2748b;font-size:32px;font-weight:900;text-shadow:2px 2px #fff,-2px -2px #fff;animation:float .65s ease-out forwards;z-index:4}.ring{position:absolute;pointer-events:none;width:65px;height:65px;border:4px solid #f6a4b8;border-radius:50%;animation:ring .6s ease-out forwards;z-index:3}.bottom{flex:none;text-align:center}.rule{border:2px solid #fffdf8;border-radius:23px;padding:12px 8px;background:#fff6dcdd;box-shadow:0 4px 12px #bd977711;margin-bottom:12px}.rule strong{font-size:18px;display:block;margin-bottom:4px}.rule strong span{color:#ed7c8b;font-size:25px}.rule p{font-size:11px;margin:0;line-height:1.6}.primary{width:100%;height:54px;border:2px solid #fff9ef;border-radius:30px;background:#7daaca;color:white;font-weight:900;font-size:20px;box-shadow:0 4px 0 #5f8ba9,0 7px 15px #688d9d20;transition:transform .1s}.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #5f8ba9}.reset{background:none;border:0;color:#987d72;margin-top:10px;font-size:12px;padding:5px 18px}.title .counter,.title .guide{visibility:hidden}.title .rule{background:transparent;border:0;box-shadow:none}.title .rule strong{font-size:16px}.title .reset{visibility:hidden}.title .speech{top:4%}.title .boy{transform:scale(1.04)}.title .topline{height:0;overflow:hidden}.finished .speech{color:#c15d64;background:#fff2e9;border-color:#ecc5b6}.finished .speech:after{background:#fff2e9;border-color:#ecc5b6}.sound{position:absolute;right:13px;top:11px;background:#ffffff70;border:0;border-radius:20px;padding:6px 8px;color:#947568;font-size:10px;z-index:5}.dots{display:flex;justify-content:center;gap:5px;margin-top:8px}.dot{width:7px;height:7px;border-radius:50%;background:#decec0}.dot.on{background:#ee8d9d}.ended-label{display:none;position:absolute;bottom:6%;right:4%;transform:rotate(-9deg);background:#fff9ed;border:2px solid #e4b79e;border-radius:14px;padding:6px 12px;font-weight:800;color:#bd8376}.finished .ended-label{display:block}@keyframes breathe{50%{transform:translateY(-3px) rotate(.4deg)}}@keyframes squish{0%{transform:scale(1)}25%{transform:scale(1.28,.60)}55%{transform:scale(.85,1.17)}80%{transform:scale(1.05,.94)}100%{transform:scale(1)}}@keyframes float{to{transform:translateY(-60px) rotate(-12deg);opacity:0}}@keyframes ring{to{transform:scale(1.7);opacity:0}}@keyframes refuse{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@media(max-height:690px){.app{padding-top:8px;padding-bottom:8px}h1{font-size:20px;margin-bottom:6px}h1 span{display:inline;font-size:1.1em}.eyebrow{display:none}.rule{padding:6px;margin-bottom:7px}.rule strong{font-size:15px;margin-bottom:0}.rule strong span{font-size:20px}.primary{height:45px;font-size:18px}.reset{margin-top:5px;padding:3px}.speech{font-size:12px;padding:7px 12px}.counter{padding:3px 12px}.counter b{font-size:23px}.dots{margin-top:4px}}@media(prefers-reduced-motion:reduce){.breathe{animation:none}.squish{animation-duration:.15s}.finished #head{animation:none}}
</style></head><body><main class="app title" id="app"><div class="room" aria-hidden="true"><div class="window"></div><div class="shelf"></div><div class="poster">✧<br>ねこの絵</div></div><button class="sound" id="sound" aria-pressed="false">音 OFF</button><header><p class="eyebrow">たった10回の、ちいさなあそび。</p><h1>めがねをはずして、<span>ぷにぷに。</span></h1><div class="topline"><div class="counter" aria-live="polite">ぷに <b id="count">0</b> / 10</div><div class="guide">タップするだけ！<small>（つままないよ！）</small></div></div><div class="dots" id="dots" aria-hidden="true"></div></header><section class="scene" id="scene" aria-label="男の子のイラスト"><div class="speech" id="speech" role="status">ぼくに、なにか用…？</div><svg class="boy" viewBox="0 0 400 450" role="group" aria-label="青いシャツと丸めがねの男の子"><defs><radialGradient id="skin"><stop stop-color="#ffe9d0"/><stop offset="1" stop-color="#f8cfac"/></radialGradient><radialGradient id="blush"><stop stop-color="#f39292" stop-opacity=".65"/><stop offset="1" stop-color="#f39292" stop-opacity="0"/></radialGradient><linearGradient id="shirt" x2="1" y2="1"><stop stop-color="#8da9d1"/><stop offset="1" stop-color="#6687b7"/></linearGradient><linearGradient id="hair" x2=".6" y2="1"><stop stop-color="#514541"/><stop offset="1" stop-color="#302d2e"/></linearGradient></defs><g class="breathe"><ellipse cx="200" cy="433" rx="126" ry="11" fill="#a3837422"/><path d="M119 333Q74 339 67 424Q200 447 333 424Q325 345 279 333L233 321H165Z" fill="url(#shirt)" stroke="#526c91" stroke-width="3"/><path d="M163 320L164 339Q200 370 237 338L237 318" fill="url(#skin)" stroke="#96715d" stroke-width="3"/><path d="M150 332Q198 386 249 333L237 330Q200 367 163 330Z" fill="#e6dfdb" stroke="#647699" stroke-width="3"/><path d="M105 365L99 413M294 366L302 416" fill="none" stroke="#5f7ba4" stroke-width="3"/><path d="M248 401l5-8 6 6 7-6 5 8v12q-12 10-23 0z" fill="#cad6e7"/><circle cx="254" cy="407" r="1.5" fill="#6f89a4"/><circle cx="265" cy="407" r="1.5" fill="#6f89a4"/><g id="head"><path d="M88 237C57 215 52 267 78 279L98 277M310 237C342 215 349 267 321 280L305 277" fill="url(#skin)" stroke="#876351" stroke-width="3"/><path d="M78 246Q67 237 75 261M322 246Q334 236 327 261" fill="none" stroke="#c68b6d" stroke-width="3" stroke-linecap="round"/><path d="M86 154Q79 98 200 94Q321 98 315 161L312 254Q308 329 206 343Q106 337 89 269Z" fill="url(#skin)" stroke="#795a4c" stroke-width="3"/><path d="M87 253Q62 218 71 169L58 187Q63 146 85 126L65 135Q101 79 157 80Q182 57 218 79L232 67L235 81Q298 76 329 137L313 131Q339 171 316 250L304 205L295 164Q287 173 278 177L258 143L250 171Q229 163 215 143L202 166Q181 156 169 143L151 170L144 151L121 179L112 164L98 208Z" fill="url(#hair)" stroke="#3f3633" stroke-width="3" stroke-linejoin="round"/><path d="M91 143Q126 100 177 98M240 101Q280 100 304 141" fill="none" stroke="#6a5750" stroke-width="6" opacity=".5" stroke-linecap="round"/><ellipse cx="121" cy="269" rx="38" ry="23" fill="url(#blush)"/><ellipse cx="280" cy="269" rx="38" ry="23" fill="url(#blush)"/><path d="M106 265l-5 13m16-14-5 14m163-14-5 13m16-14-5 14" stroke="#e59689" stroke-width="2" stroke-linecap="round"/><path d="M115 198Q138 199 153 188M249 188Q265 199 285 198" stroke="#846047" stroke-width="4" fill="none" stroke-linecap="round"/>
<g class="eye" id="leftEye" role="button" aria-label="左の目をぷにぷに" tabindex="-1"><g class="puni-eye"><path class="eye-line" d="M122 219C156 204 168 228 142 237C177 230 173 261 132 261"/></g><g class="normal-eye"><ellipse cx="144" cy="233" rx="5" ry="8" fill="#513f35"/></g><rect class="hit" x="106" y="201" width="76" height="74" rx="26"/></g><g class="eye" id="rightEye" role="button" aria-label="右の目をぷにぷに" tabindex="-1"><g class="puni-eye"><path class="eye-line" d="M239 219C273 204 285 228 259 237C294 230 290 261 249 261"/></g><g class="normal-eye"><ellipse cx="260" cy="233" rx="5" ry="8" fill="#513f35"/></g><rect class="hit" x="223" y="201" width="76" height="74" rx="26"/></g>
<path d="M194 259Q215 251 207 269L203 272" fill="none" stroke="#674735" stroke-width="6" stroke-linecap="round"/><path class="mouth" d="M184 294L191 312M187 295Q203 289 219 292Q218 308 209 316" fill="none" stroke="#674735" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g class="anger" fill="none" stroke="#905648" stroke-width="5" stroke-linecap="round"><path d="M182 308Q201 291 220 308M121 194L155 204M249 204L281 194"/><path d="M299 159v9h-9m24-9v9h9m-24 22v-9h-9m24 9v-9h9" stroke="#d97a76" stroke-width="3"/></g><g class="glasses" fill="#ffffff24" stroke="#645b55" stroke-width="5"><circle cx="141" cy="231" r="37"/><circle cx="261" cy="231" r="37"/><path d="M178 228Q200 216 224 228M104 225L87 218M299 225L313 218" fill="none"/><path d="M117 218l10-12M238 218l10-12" stroke="#fff" opacity=".6" stroke-width="4"/></g></g><g fill="url(#skin)" stroke="#a77b60" stroke-width="3" stroke-linejoin="round"><path d="M135 421Q117 406 125 385L122 368Q123 355 133 357Q138 339 151 346Q165 339 172 352Q187 354 182 370Q192 384 181 397L164 420Z"/><path d="M267 421Q285 406 277 385L280 368Q279 355 269 357Q264 339 251 346Q237 339 230 352Q215 354 220 370Q210 384 221 397L238 420Z"/><path d="M135 365Q154 355 175 367M137 382Q161 372 181 383M267 365Q248 355 227 367M265 382Q241 372 221 383" fill="none" stroke="#ca9271"/></g></g></svg><div class="ended-label">本日は、閉店です。</div></section><footer class="bottom"><div class="rule"><strong id="ruleTitle">めがねの向こうに、ひみつの顔。</strong><p id="ruleText">はずして、さわって、もうおしまい。</p></div><button class="primary" id="action">スタート</button><button class="reset" id="reset">↻ やりなおす</button></footer></main>
<script>
(()=>{'use strict';let state='title',count=0,sound=false,ctx;const $=id=>document.getElementById(id),app=$('app'),eyes=[$('leftEye'),$('rightEye')];const lines=['ど、どうかな…？','えっ','な、なに？','くすぐったいよぉ…','くすぐったいよぉ…','もういいでしょ…','もういいでしょ…','や、やめてよぉ','や、やめてよぉ','つ、次でほんとに怒るよ…！','もうやめてってば！！'];function tone(end=false){if(!sound)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='sine';o.frequency.setValueAtTime(end?240:620,t);o.frequency.exponentialRampToValueAtTime(end?100:210,t+.14);g.gain.setValueAtTime(.13,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(ctx.destination);o.start();o.stop(t+.21)}catch{}}function render(){app.className='app '+state;$('count').textContent=count;eyes.forEach(e=>{e.setAttribute('tabindex',state==='play'?'0':'-1');e.setAttribute('aria-disabled',state==='play'?'false':'true')});$('dots').innerHTML=state==='title'?'':Array.from({length:10},(_,i)=>'<i class="dot '+(i<count?'on':'')+'"></i>').join('');$('action').hidden=state==='play';$('reset').hidden=state==='finished';$('action').textContent=state==='title'?'スタート':state==='glassesOn'?'めがねをはずす':'↻ やりなおす';$('ruleTitle').innerHTML=state==='title'?'めがねの向こうに、ひみつの顔。':state==='finished'?'これにて、おしまい。':'<span>10</span>回でおしまい…';$('ruleText').textContent=state==='title'?'はずして、さわって、もうおしまい。':state==='finished'?'10回ぷにぷにしました。そっとしておこう。':'それ以上ぷにぷにすると、イヤがっちゃうよ。';$('speech').textContent=state==='title'?'ぼくに、なにか用…？':state==='glassesOn'?'めがね、はずすの…？':lines[count]}
function reset(){state='title';count=0;document.querySelectorAll('.effect,.ring').forEach(e=>e.remove());eyes.forEach(e=>e.classList.remove('squish'));render()}function tap(e){if(state!=='play')return;count++;e.classList.remove('squish');void e.getBoundingClientRect();e.classList.add('squish');const bounds=e.getBoundingClientRect(),scene=$('scene').getBoundingClientRect(),x=bounds.left+bounds.width/2-scene.left,y=bounds.top+bounds.height/2-scene.top;for(const kind of ['effect','ring']){const el=document.createElement('span');el.className=kind;el.textContent=kind==='effect'?'ぷにっ':'';el.style.left=(x-(kind==='effect'?40:32))+'px';el.style.top=(y-(kind==='effect'?45:32))+'px';$('scene').append(el);el.addEventListener('animationend',()=>el.remove(),{once:true})}if(count===10)state='finished';tone(count===10);render()}
$('action').addEventListener('click',()=>{if(state==='title'){state='glassesOn';render()}else if(state==='glassesOn'){state='play';render()}else if(state==='finished')reset()});$('reset').addEventListener('click',reset);eyes.forEach(e=>{e.addEventListener('click',()=>tap(e));e.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();if(!event.repeat)tap(e)}})});$('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent=sound?'音 ON':'音 OFF';$('sound').setAttribute('aria-pressed',String(sound));tone()});render();})();
</script></body></html>
